
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Table with Colspan and Rowspan</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4ff;
            padding: 30px 15px;
        }

        h1, p {
            text-align: center;
        }

        h1 {
            color: #4338ca;
        }

        table {
            width: 100%;
            max-width: 750px;
            margin: 25px auto;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            border: 1px solid #777;
            padding: 14px;
            text-align: center;
        }

        th {
            background: #4338ca;
            color: white;
        }

        .course {
            background: #dbeafe;
            font-weight: bold;
        }

        @media (max-width: 480px) {
            th, td {
                padding: 7px 4px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <h1>Student Marks Table</h1>
    <p>Demonstration of HTML colspan and rowspan</p>

    <table>
        <tr>
            <th colspan="4">Student Academic Report</th>
        </tr>

        <tr>
            <th>Course</th>
            <th>Student Name</th>
            <th>Subject</th>
            <th>Marks</th>
        </tr>

        <tr>
            <td class="course" rowspan="2">MCA</td>
            <td>Sejal</td>
            <td>HTML</td>
            <td>85</td>
        </tr>

        <tr>
            <td>Priya</td>
            <td>CSS</td>
            <td>90</td>
        </tr>

        <tr>
            <td class="course" rowspan="2">BCA</td>
            <td>Amit</td>
            <td>Java</td>
            <td>88</td>
        </tr>

        <tr>
            <td>Rahul</td>
            <td>Python</td>
            <td>92</td>
        </tr>

        <tr>
            <th colspan="3">Highest Marks</th>
            <th>92</th>
        </tr>
    </table>

</body>
</html>
